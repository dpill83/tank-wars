<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tank Wars</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #eee; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  h1 { margin: 10px 0 5px; color: #e94560; font-size: 1.6rem; letter-spacing: 2px; }
  #game-wrap { position: relative; }
  canvas { display: block; border: 2px solid #e94560; border-radius: 4px; }
  #ui { display: flex; gap: 20px; align-items: flex-start; padding: 10px 0; width: 800px; }
  .player-panel { flex: 1; background: #16213e; border-radius: 6px; padding: 10px 14px; border: 2px solid transparent; }
  .player-panel.active { border-color: #e94560; }
  .player-panel h2 { font-size: 0.9rem; margin-bottom: 8px; }
  .p1-title { color: #4ecdc4; }
  .p2-title { color: #ff6b6b; }
  .health-bar { background: #333; border-radius: 4px; height: 12px; margin: 4px 0 8px; }
  .health-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
  .h1 { background: #4ecdc4; }
  .h2 { background: #ff6b6b; }
  label { display: block; font-size: 0.75rem; color: #aaa; margin-bottom: 2px; }
  input[type=range] { width: 100%; accent-color: #e94560; margin-bottom: 6px; }
  .val { font-size: 0.85rem; color: #fff; font-weight: bold; }
  #center-panel { text-align: center; min-width: 160px; }
  #turn-info { font-size: 1rem; color: #e94560; font-weight: bold; margin-bottom: 6px; }
  #status-msg { font-size: 0.75rem; color: #aaa; min-height: 18px; margin-bottom: 8px; }
  button { background: #e94560; color: #fff; border: none; border-radius: 4px; padding: 8px 18px; font-size: 0.9rem; cursor: pointer; font-family: inherit; letter-spacing: 1px; display: block; width: 100%; margin-top: 4px; }
  button:hover { background: #c73652; }
  button:disabled { background: #555; cursor: default; }
  #winner-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; flex-direction: column; border-radius: 4px; }
  #winner-overlay.show { display: flex; }
  #winner-text { font-size: 2.2rem; font-weight: bold; color: #e94560; text-shadow: 0 0 20px #e94560; margin-bottom: 20px; }
  #restart-btn { width: auto; padding: 10px 30px; font-size: 1rem; }
</style>
</head>
<body>
<h1>TANK WARS</h1>
<div id="game-wrap">
  <canvas id="c" width="800" height="420"></canvas>
  <div id="winner-overlay">
    <div id="winner-text"></div>
    <button id="restart-btn" onclick="initGame()">PLAY AGAIN</button>
  </div>
</div>
<div id="ui">
  <div class="player-panel" id="panel1">
    <h2 class="p1-title">TANK 1</h2>
    <div class="health-bar"><div class="health-fill h1" id="hp1" style="width:100%"></div></div>
    <span class="val" id="hp1val">100 HP</span>
    <br><br>
    <label>Angle: <span id="angle1val">45°</span></label>
    <input type="range" id="angle1" min="0" max="180" value="45">
    <label>Power: <span id="power1val">50</span></label>
    <input type="range" id="power1" min="5" max="100" value="50">
  </div>
  <div id="center-panel">
    <div id="turn-info">PLAYER 1</div>
    <div id="status-msg">Aim and fire!</div>
    <button id="fire-btn" onclick="fire()">FIRE!</button>
    <button onclick="initGame()" style="margin-top:8px;background:#333;font-size:0.75rem;padding:5px;">New Game</button>
    <div style="margin-top:10px;font-size:0.7rem;color:#555;">Wind: <span id="wind-display">0</span></div>
  </div>
  <div class="player-panel" id="panel2">
    <h2 class="p2-title">TANK 2</h2>
    <div class="health-bar"><div class="health-fill h2" id="hp2" style="width:100%"></div></div>
    <span class="val" id="hp2val">100 HP</span>
    <br><br>
    <label>Angle: <span id="angle2val">135°</span></label>
    <input type="range" id="angle2" min="0" max="180" value="135">
    <label>Power: <span id="power2val">50</span></label>
    <input type="range" id="power2" min="5" max="100" value="50">
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// --- Audio ---
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playFire() {
  const ac = getAudioCtx();
  const buf = ac.createBuffer(1, ac.sampleRate * 0.25, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) {
    const t = i / ac.sampleRate;
    d[i] = (Math.random() * 2 - 1) * Math.exp(-t * 18) * 0.9;
  }
  const src = ac.createBufferSource();
  src.buffer = buf;
  const filter = ac.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 400;
  src.connect(filter);
  filter.connect(ac.destination);
  src.start();
}

function playWhistle() {
  const ac = getAudioCtx();
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(900, ac.currentTime);
  osc.frequency.linearRampToValueAtTime(500, ac.currentTime + 1.5);
  gain.gain.setValueAtTime(0.18, ac.currentTime);
  gain.gain.linearRampToValueAtTime(0, ac.currentTime + 1.5);
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.start();
  osc.stop(ac.currentTime + 1.5);
}

let whistleOsc = null, whistleGain = null;
function startWhistle() {
  const ac = getAudioCtx();
  whistleOsc = ac.createOscillator();
  whistleGain = ac.createGain();
  whistleOsc.type = 'sine';
  whistleOsc.frequency.setValueAtTime(1000, ac.currentTime);
  whistleGain.gain.setValueAtTime(0.12, ac.currentTime);
  whistleOsc.connect(whistleGain);
  whistleGain.connect(ac.destination);
  whistleOsc.start();
}
function updateWhistle(vy) {
  if (!whistleOsc) return;
  const ac = getAudioCtx();
  const freq = Math.max(300, 1000 - vy * 30);
  whistleOsc.frequency.setTargetAtTime(freq, ac.currentTime, 0.05);
}
function stopWhistle() {
  if (!whistleOsc) return;
  const ac = getAudioCtx();
  whistleGain.gain.setTargetAtTime(0, ac.currentTime, 0.05);
  whistleOsc.stop(ac.currentTime + 0.1);
  whistleOsc = null; whistleGain = null;
}

function playExplosion() {
  const ac = getAudioCtx();
  const dur = 0.8;
  const buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) {
    const t = i / ac.sampleRate;
    d[i] = (Math.random() * 2 - 1) * Math.exp(-t * 6) * 1.0;
  }
  const src = ac.createBufferSource();
  src.buffer = buf;
  const filter = ac.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 250;
  const gain = ac.createGain();
  gain.gain.setValueAtTime(1.0, ac.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  src.connect(filter);
  filter.connect(gain);
  gain.connect(ac.destination);
  src.start();
}

function playMiss() {
  const ac = getAudioCtx();
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(300, ac.currentTime);
  osc.frequency.linearRampToValueAtTime(80, ac.currentTime + 0.4);
  gain.gain.setValueAtTime(0.15, ac.currentTime);
  gain.gain.linearRampToValueAtTime(0, ac.currentTime + 0.4);
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.start();
  osc.stop(ac.currentTime + 0.4);
}

// --- State ---
let terrain, tanks, projectile, currentPlayer, gameOver, wind;
let animId = null;

const TANK_W = 28, TANK_H = 14, BARREL_LEN = 18;
const GRAVITY = 0.18;
const BLAST_RADIUS = 30;
const DIRECT_DAMAGE = 60;
const SPLASH_DAMAGE = 30;

function initGame() {
  document.getElementById('winner-overlay').classList.remove('show');
  terrain = generateTerrain();
  wind = (Math.random() * 2 - 1).toFixed(2) * 1;
  projectile = null;
  gameOver = false;
  currentPlayer = 0;

  // Place tanks on terrain
  const x1 = 80, x2 = W - 80;
  tanks = [
    { x: x1, y: terrainY(x1) - TANK_H, hp: 100, color: '#4ecdc4', id: 0 },
    { x: x2, y: terrainY(x2) - TANK_H, hp: 100, color: '#ff6b6b', id: 1 }
  ];

  updateUI();
  render();
}

// --- Terrain ---
function generateTerrain() {
  const pts = new Float32Array(W);
  // Start with some base height variation using midpoint displacement
  const baseH = H * 0.55;
  pts[0] = baseH + (Math.random() - 0.5) * 60;
  pts[W - 1] = baseH + (Math.random() - 0.5) * 60;

  function displace(lo, hi, roughness) {
    if (hi - lo < 2) return;
    const mid = (lo + hi) >> 1;
    pts[mid] = (pts[lo] + pts[hi]) / 2 + (Math.random() - 0.5) * (hi - lo) * roughness;
    pts[mid] = Math.max(H * 0.25, Math.min(H * 0.82, pts[mid]));
    displace(lo, mid, roughness);
    displace(mid, hi, roughness);
  }
  displace(0, W - 1, 0.55);

  // Fill gaps with interpolation
  for (let x = 0; x < W; x++) {
    if (!pts[x]) {
      let lo = x - 1, hi = x + 1;
      while (hi < W && !pts[hi]) hi++;
      if (lo >= 0 && hi < W) pts[x] = pts[lo] + (pts[hi] - pts[lo]) * ((x - lo) / (hi - lo));
    }
  }

  // Smooth
  const smooth = new Float32Array(W);
  for (let x = 0; x < W; x++) {
    let sum = 0, n = 0;
    for (let d = -4; d <= 4; d++) {
      const xi = x + d;
      if (xi >= 0 && xi < W) { sum += pts[xi]; n++; }
    }
    smooth[x] = sum / n;
  }
  return smooth;
}

function terrainY(x) {
  const xi = Math.round(Math.max(0, Math.min(W - 1, x)));
  return terrain[xi];
}

function destroyTerrain(cx, cy, radius) {
  for (let x = Math.max(0, Math.floor(cx - radius)); x <= Math.min(W - 1, Math.ceil(cx + radius)); x++) {
    const dx = x - cx;
    const depth = Math.sqrt(Math.max(0, radius * radius - dx * dx));
    const newY = cy + depth;
    if (newY > terrain[x]) terrain[x] = newY;
  }
}

// --- Render ---
function render() {
  ctx.clearRect(0, 0, W, H);

  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#0f3460');
  sky.addColorStop(1, '#16213e');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  drawTerrain();
  tanks.forEach(t => drawTank(t));
  if (projectile) drawProjectile();
}

function drawTerrain() {
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x < W; x++) ctx.lineTo(x, terrain[x]);
  ctx.lineTo(W, H);
  ctx.closePath();

  const grad = ctx.createLinearGradient(0, H * 0.4, 0, H);
  grad.addColorStop(0, '#4a7c59');
  grad.addColorStop(0.3, '#3a6b49');
  grad.addColorStop(1, '#2d4a2d');
  ctx.fillStyle = grad;
  ctx.fill();

  // Terrain top line
  ctx.beginPath();
  ctx.moveTo(0, terrain[0]);
  for (let x = 1; x < W; x++) ctx.lineTo(x, terrain[x]);
  ctx.strokeStyle = '#5d9e6e';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawTank(t) {
  if (t.hp <= 0) return;
  const tx = t.x, ty = t.y;

  // Treads
  ctx.fillStyle = '#444';
  ctx.beginPath();
  ctx.roundRect(tx - TANK_W / 2 - 3, ty + TANK_H * 0.4, TANK_W + 6, TANK_H * 0.55, 4);
  ctx.fill();

  // Body
  ctx.fillStyle = t.color;
  ctx.beginPath();
  ctx.roundRect(tx - TANK_W / 2, ty, TANK_W, TANK_H * 0.7, 3);
  ctx.fill();

  // Turret dome
  ctx.beginPath();
  ctx.ellipse(tx, ty + 2, TANK_W * 0.32, TANK_H * 0.45, 0, Math.PI, 0);
  ctx.fillStyle = t.color;
  ctx.fill();

  // Barrel
  const angle = getAngle(t);
  const bx = tx + Math.cos(angle) * BARREL_LEN;
  const by = (ty + 2) - Math.sin(angle) * BARREL_LEN;
  ctx.beginPath();
  ctx.moveTo(tx, ty + 2);
  ctx.lineTo(bx, by);
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.strokeStyle = t.color;
  ctx.lineWidth = 2;
  ctx.stroke();

  // HP label
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(t.hp, tx, ty - 5);
}

function getAngle(tank) {
  const deg = parseInt(tank.id === 0
    ? document.getElementById('angle1').value
    : document.getElementById('angle2').value);
  // Tank 1 aims right (0=right, 90=up), Tank 2 aims left (180=left side)
  return (deg * Math.PI) / 180;
}

function drawProjectile() {
  const p = projectile;
  // Trail
  ctx.beginPath();
  for (let i = Math.max(0, p.trail.length - 12); i < p.trail.length; i++) {
    const pt = p.trail[i];
    const alpha = (i - (p.trail.length - 12)) / 12;
    ctx.globalAlpha = alpha * 0.6;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 2, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd700';
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Ball
  ctx.beginPath();
  ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#ff4444';
  ctx.fill();
  ctx.strokeStyle = '#ffaa00';
  ctx.lineWidth = 1;
  ctx.stroke();
}

// --- Physics ---
function fire() {
  if (projectile || gameOver) return;
  const t = tanks[currentPlayer];
  if (t.hp <= 0) return;

  const angleEl = currentPlayer === 0 ? document.getElementById('angle1') : document.getElementById('angle2');
  const powerEl = currentPlayer === 0 ? document.getElementById('power1') : document.getElementById('power2');
  const angle = parseFloat(angleEl.value) * Math.PI / 180;
  const power = parseFloat(powerEl.value) * 0.05;

  projectile = {
    x: t.x + Math.cos(angle) * BARREL_LEN,
    y: (t.y + 2) - Math.sin(angle) * BARREL_LEN,
    vx: Math.cos(angle) * power,
    vy: -Math.sin(angle) * power,
    trail: []
  };

  document.getElementById('fire-btn').disabled = true;
  setStatus('Projectile in flight...');
  playFire();
  startWhistle();
  loop();
}

function loop() {
  animId = requestAnimationFrame(loop);
  stepPhysics();
  render();
}

function stepPhysics() {
  if (!projectile) return;
  const p = projectile;

  p.trail.push({ x: p.x, y: p.y });
  if (p.trail.length > 20) p.trail.shift();

  p.vy += GRAVITY;
  p.vx += wind * 0.01;
  p.x += p.vx;
  p.y += p.vy;
  updateWhistle(p.vy);

  // Hit terrain
  if (p.y >= terrainY(p.x)) {
    explode(p.x, p.y);
    return;
  }

  // Out of bounds
  if (p.x < -50 || p.x > W + 50 || p.y > H + 50) {
    stopWhistle();
    playMiss();
    projectile = null;
    cancelAnimationFrame(animId);
    animId = null;
    setStatus('Miss! Shot went out of bounds.');
    endTurn();
    render();
    return;
  }

  // Hit tank
  for (const t of tanks) {
    if (t.id === currentPlayer || t.hp <= 0) continue;
    const dx = p.x - t.x, dy = p.y - t.y;
    if (Math.abs(dx) < TANK_W / 2 + 4 && Math.abs(dy) < TANK_H + 4) {
      explode(p.x, p.y);
      return;
    }
  }
}

function explode(ex, ey) {
  stopWhistle();
  playExplosion();
  cancelAnimationFrame(animId);
  animId = null;
  projectile = null;

  destroyTerrain(ex, ey, BLAST_RADIUS);

  // Settle tanks onto terrain
  for (const t of tanks) {
    const ty = terrainY(t.x);
    t.y = ty - TANK_H;
  }

  // Deal damage
  let hit = false;
  for (const t of tanks) {
    if (t.hp <= 0) continue;
    const dx = ex - t.x, dy = ey - t.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 8) {
      t.hp = Math.max(0, t.hp - DIRECT_DAMAGE);
      hit = true;
    } else if (dist < BLAST_RADIUS + 20) {
      const dmg = Math.round(SPLASH_DAMAGE * (1 - dist / (BLAST_RADIUS + 20)));
      t.hp = Math.max(0, t.hp - dmg);
      if (dmg > 0) hit = true;
    }
  }

  // Explosion flash
  drawExplosion(ex, ey);

  updateUI();

  // Check win
  const dead = tanks.filter(t => t.hp <= 0);
  if (dead.length > 0) {
    const winner = tanks.find(t => t.hp > 0);
    setTimeout(() => {
      render();
      showWinner(winner ? `TANK ${winner.id + 1} WINS!` : 'DRAW!');
    }, 400);
    gameOver = true;
    return;
  }

  setStatus(hit ? `Hit! ${DIRECT_DAMAGE > 0 ? '' : ''}` : 'Miss!');
  setTimeout(() => {
    endTurn();
    render();
  }, 300);
}

function drawExplosion(ex, ey) {
  // Draw then render frame
  ctx.save();
  ctx.beginPath();
  ctx.arc(ex, ey, BLAST_RADIUS, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(ex, ey, 0, ex, ey, BLAST_RADIUS);
  grad.addColorStop(0, 'rgba(255,255,200,0.95)');
  grad.addColorStop(0.4, 'rgba(255,140,0,0.8)');
  grad.addColorStop(1, 'rgba(255,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();
}

function endTurn() {
  currentPlayer = currentPlayer === 0 ? 1 : 0;
  wind = parseFloat(((Math.random() * 2 - 1) * 1.5).toFixed(2));
  document.getElementById('fire-btn').disabled = false;
  updateUI();
}

function showWinner(msg) {
  document.getElementById('winner-text').textContent = msg;
  document.getElementById('winner-overlay').classList.add('show');
  gameOver = true;
}

function setStatus(msg) {
  document.getElementById('status-msg').textContent = msg;
}

function updateUI() {
  // Health bars
  const hp1 = tanks[0].hp, hp2 = tanks[1].hp;
  document.getElementById('hp1').style.width = hp1 + '%';
  document.getElementById('hp2').style.width = hp2 + '%';
  document.getElementById('hp1val').textContent = hp1 + ' HP';
  document.getElementById('hp2val').textContent = hp2 + ' HP';

  // Active panel highlight
  document.getElementById('panel1').classList.toggle('active', currentPlayer === 0);
  document.getElementById('panel2').classList.toggle('active', currentPlayer === 1);

  document.getElementById('turn-info').textContent = `PLAYER ${currentPlayer + 1}`;
  document.getElementById('wind-display').textContent = (wind > 0 ? '+' : '') + wind.toFixed(2);

  if (!gameOver) setStatus('Aim and fire!');
}

// Slider live updates
['angle1','power1','angle2','power2'].forEach(id => {
  const el = document.getElementById(id);
  const valEl = document.getElementById(id + 'val');
  el.addEventListener('input', () => {
    valEl.textContent = id.startsWith('angle') ? el.value + '°' : el.value;
    if (!projectile) render();
  });
});

// Init
initGame();
</script>
</body>
</html>
