<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tank Wars</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #080c1e;
  color: #fff;
  font-family: 'Press Start 2P', 'Courier New', monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 14px 0 28px;
}
h1 {
  font-size: 2rem;
  letter-spacing: 6px;
  color: #fff;
  text-shadow: 0 0 8px #00ddff, 0 0 20px #00ddff, 0 0 40px rgba(0,200,255,0.4);
  margin-bottom: 12px;
}
#game-wrap { position: relative; line-height: 0; }
canvas {
  display: block;
  border: 3px solid #1a3560;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
#ui {
  display: flex;
  gap: 10px;
  margin-top: 10px;
  width: 806px;
}
.player-panel {
  flex: 1;
  background: #0b1530;
  border: 2px solid #1a3560;
  padding: 12px 14px 14px;
  transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
}
#panel1.active {
  border-color: #00e5cc;
  box-shadow: 0 0 16px rgba(0,229,204,0.5), inset 0 0 14px rgba(0,229,204,0.1);
  background: #0a1e20;
}
#panel2.active {
  border-color: #ff4da6;
  box-shadow: 0 0 16px rgba(255,77,166,0.5), inset 0 0 14px rgba(255,77,166,0.1);
  background: #1a0f1e;
}
#center-panel {
  width: 196px;
  flex-shrink: 0;
  background: #0b1530;
  border: 2px solid #1a3560;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.panel-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 0.55rem;
  letter-spacing: 1px;
}
.p1c { color: #00e5cc; }
.p2c { color: #ff4da6; }
.hp-bar { height: 13px; background: #1a2a4a; margin-bottom: 10px; }
.hp-fill { height: 100%; transition: width 0.3s; }
.hp1f { background: #00e5cc; }
.hp2f { background: #ff4da6; }
.ctrl-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.ctrl-lbl { font-size: 0.46rem; white-space: nowrap; min-width: 78px; letter-spacing: 0.5px; }

input[type=range] {
  -webkit-appearance: none;
  flex: 1;
  height: 6px;
  outline: none;
  border: none;
  cursor: pointer;
  background: #1a2a4a;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  background: #fff;
  cursor: pointer;
}
input[type=range]::-moz-range-thumb {
  width: 14px; height: 14px;
  background: #fff;
  border: none;
  cursor: pointer;
}

#fire-btn {
  background: #e0187f;
  color: #fff;
  border: none;
  font-family: inherit;
  font-size: 1rem;
  padding: 13px 10px;
  cursor: pointer;
  letter-spacing: 3px;
  box-shadow: 0 0 14px #e0187f, 0 0 28px rgba(224,24,127,0.45);
  width: 100%;
}
#fire-btn:hover { background: #ff2fa0; }
#fire-btn:disabled { background: #2a0a1e; box-shadow: none; color: #553; }

#new-game-btn {
  background: #121e38;
  color: #7788aa;
  border: 2px solid #1e3055;
  font-family: inherit;
  font-size: 0.44rem;
  padding: 9px 8px;
  cursor: pointer;
  letter-spacing: 1px;
  width: 100%;
}
#new-game-btn:hover { color: #fff; border-color: #3a5080; }

#mute-btn {
  background: #121e38;
  color: #7788aa;
  border: 2px solid #1e3055;
  font-family: inherit;
  font-size: 0.44rem;
  padding: 7px 8px;
  cursor: pointer;
  letter-spacing: 1px;
  width: 100%;
}
#mute-btn:hover { color: #fff; border-color: #3a5080; }
#mute-btn.muted { color: #ff4444; border-color: #882222; }
#key-hint { font-size: 0.3rem; color: #2a3a4a; letter-spacing: 0.5px; text-align: center; line-height: 1.8; }

#wind-box { text-align: center; line-height: 1.6; }
#wind-dir { font-size: 0.7rem; letter-spacing: 3px; min-height: 18px; }
#wind-val { font-size: 0.42rem; color: #6688cc; letter-spacing: 1px; }
#status-msg { font-size: 0.38rem; color: #334; min-height: 12px; text-align: center; }

/* Winner overlay */
#winner-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(4,6,18,0.95);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 100;
  gap: 8px;
}
#winner-overlay.show { display: flex; }
#w-title {
  font-size: 1.8rem;
  color: #fff;
  text-shadow: 0 0 8px #00ddff, 0 0 22px #00ddff;
  letter-spacing: 5px;
}
#w-sub {
  font-size: 0.95rem;
  color: #cc44ff;
  text-shadow: 0 0 10px #cc44ff;
  letter-spacing: 3px;
  margin-bottom: 8px;
}
#w-box {
  background: #0b1530;
  border: 3px solid #1a3560;
  padding: 20px 28px;
  min-width: 500px;
  text-align: center;
}
#w-name {
  font-size: 1rem;
  color: #fff;
  text-shadow: 0 0 8px #fff;
  margin-bottom: 18px;
  letter-spacing: 2px;
}
#stats-tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.44rem;
}
#stats-tbl th {
  color: #7788aa;
  padding: 5px 12px;
  text-align: right;
  font-weight: normal;
  border-bottom: 1px solid #1a3560;
}
#stats-tbl th:first-child { text-align: left; }
#stats-tbl td { padding: 7px 12px; text-align: right; }
#stats-tbl td:first-child { text-align: left; }
#stats-tbl .r1 td:first-child { color: #00e5cc; }
#stats-tbl .r2 td:first-child { color: #ff4da6; }
.sv { color: #ffdd44; }

.win-btns { display: flex; gap: 14px; margin-top: 6px; }
.wbtn {
  font-family: inherit;
  font-size: 0.6rem;
  padding: 12px 22px;
  cursor: pointer;
  letter-spacing: 2px;
  background: transparent;
}
#wbtn1 { color: #ff4da6; border: 3px solid #ff4da6; box-shadow: 0 0 8px rgba(255,77,166,0.4); }
#wbtn1:hover { background: rgba(255,77,166,0.12); }
#wbtn2 { color: #00e5ff; border: 3px solid #00e5ff; box-shadow: 0 0 8px rgba(0,229,255,0.4); }
#wbtn2:hover { background: rgba(0,229,255,0.1); }
</style>
</head>
<body>
<h1>TANK WARS</h1>
<div id="game-wrap">
  <canvas id="c" width="800" height="420"></canvas>
</div>
<div id="ui">
  <div class="player-panel" id="panel1">
    <div class="panel-header">
      <span class="p1c">PLAYER 1</span>
      <span class="p1c" id="hp1val">100 HP</span>
    </div>
    <div class="hp-bar"><div class="hp-fill hp1f" id="hp1" style="width:100%"></div></div>
    <div class="ctrl-row">
      <span class="ctrl-lbl">ANGLE: <span id="angle1val">45°</span></span>
      <input type="range" id="angle1" min="0" max="180" value="45">
    </div>
    <div class="ctrl-row">
      <span class="ctrl-lbl">POWER: <span id="power1val">50</span></span>
      <input type="range" id="power1" min="5" max="100" value="50">
    </div>
  </div>
  <div id="center-panel">
    <button id="fire-btn" onclick="fire()">FIRE!</button>
    <button id="new-game-btn" onclick="initGame()">NEW GAME</button>
    <button id="mute-btn" onclick="toggleMute()">SFX: ON</button>
    <div id="key-hint">W/S·ANGLE · A/D·POWER · SPACE·FIRE</div>
    <div id="wind-box">
      <div id="wind-dir">─</div>
      <div id="wind-val">WIND: +0.00</div>
    </div>
    <div id="status-msg"></div>
  </div>
  <div class="player-panel" id="panel2">
    <div class="panel-header">
      <span class="p2c">PLAYER 2</span>
      <span class="p2c" id="hp2val">100 HP</span>
    </div>
    <div class="hp-bar"><div class="hp-fill hp2f" id="hp2" style="width:100%"></div></div>
    <div class="ctrl-row">
      <span class="ctrl-lbl">ANGLE: <span id="angle2val">135°</span></span>
      <input type="range" id="angle2" min="0" max="180" value="135">
    </div>
    <div class="ctrl-row">
      <span class="ctrl-lbl">POWER: <span id="power2val">50</span></span>
      <input type="range" id="power2" min="5" max="100" value="50">
    </div>
  </div>
</div>

<div id="winner-overlay">
  <div id="w-title">TANK WARS</div>
  <div id="w-sub">VICTORY!</div>
  <div id="w-box">
    <div id="w-name">PLAYER 1 WINS!</div>
    <table id="stats-tbl">
      <thead>
        <tr>
          <th></th><th>Accuracy</th><th>Damage Dealt</th><th>Direct Hits</th>
        </tr>
      </thead>
      <tbody>
        <tr class="r1">
          <td>Player 1</td>
          <td class="sv" id="s-acc1">-</td>
          <td class="sv" id="s-dmg1">-</td>
          <td class="sv" id="s-hit1">-</td>
        </tr>
        <tr class="r2">
          <td>Player 2</td>
          <td class="sv" id="s-acc2">-</td>
          <td class="sv" id="s-dmg2">-</td>
          <td class="sv" id="s-hit2">-</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="win-btns">
    <button class="wbtn" id="wbtn1" onclick="initGame()">REMATCH</button>
    <button class="wbtn" id="wbtn2" onclick="initGame()">MAIN MENU</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// --- Audio ---
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playFire() {
  if (muted) return;
  const ac = getAudioCtx();
  const buf = ac.createBuffer(1, ac.sampleRate * 0.25, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) {
    const t = i / ac.sampleRate;
    d[i] = (Math.random() * 2 - 1) * Math.exp(-t * 18) * 0.9;
  }
  const src = ac.createBufferSource();
  src.buffer = buf;
  const filter = ac.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 400;
  src.connect(filter);
  filter.connect(ac.destination);
  src.start();
}
let whistleOsc = null, whistleGain = null;
function startWhistle() {
  if (muted) return;
  const ac = getAudioCtx();
  whistleOsc = ac.createOscillator();
  whistleGain = ac.createGain();
  whistleOsc.type = 'sine';
  whistleOsc.frequency.setValueAtTime(1000, ac.currentTime);
  whistleGain.gain.setValueAtTime(0.12, ac.currentTime);
  whistleOsc.connect(whistleGain);
  whistleGain.connect(ac.destination);
  whistleOsc.start();
}
function updateWhistle(vy) {
  if (!whistleOsc) return;
  const ac = getAudioCtx();
  // vy < 0 = rising → high pitch; vy > 0 = falling → low pitch
  const freq = Math.max(180, Math.min(2600, 1400 - vy * 100));
  whistleOsc.frequency.setTargetAtTime(freq, ac.currentTime, 0.04);
}
function stopWhistle() {
  if (!whistleOsc) return;
  const ac = getAudioCtx();
  whistleGain.gain.setTargetAtTime(0, ac.currentTime, 0.05);
  whistleOsc.stop(ac.currentTime + 0.1);
  whistleOsc = null; whistleGain = null;
}
// Terrain hit — muffled thud
function playExplosion() {
  if (muted) return;
  const ac = getAudioCtx();
  const dur = 0.8;
  const buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) {
    const t = i / ac.sampleRate;
    d[i] = (Math.random() * 2 - 1) * Math.exp(-t * 6);
  }
  const src = ac.createBufferSource();
  src.buffer = buf;
  const filter = ac.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 250;
  const gain = ac.createGain();
  gain.gain.setValueAtTime(1.0, ac.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  src.connect(filter);
  filter.connect(gain);
  gain.connect(ac.destination);
  src.start();
}
// Tank hit — bigger boom with metallic clang
function playTankExplosion() {
  if (muted) return;
  const ac = getAudioCtx();
  // Deep boom
  const dur = 1.4;
  const buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) {
    const t = i / ac.sampleRate;
    d[i] = ((Math.random() * 2 - 1) * 0.65 + Math.sin(2 * Math.PI * 55 * t) * 0.35) * Math.exp(-t * 3.5);
  }
  const src = ac.createBufferSource();
  src.buffer = buf;
  const filter = ac.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 200;
  const gain = ac.createGain();
  gain.gain.setValueAtTime(1.5, ac.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  src.connect(filter);
  filter.connect(gain);
  gain.connect(ac.destination);
  src.start();
  // Metallic clang on top
  const osc = ac.createOscillator();
  const og = ac.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(900, ac.currentTime);
  osc.frequency.exponentialRampToValueAtTime(120, ac.currentTime + 0.35);
  og.gain.setValueAtTime(0.35, ac.currentTime);
  og.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.35);
  osc.connect(og); og.connect(ac.destination);
  osc.start(); osc.stop(ac.currentTime + 0.35);
}
let lastClickTime = 0;
function playSliderClick() {
  if (muted) return;
  const now = performance.now();
  if (now - lastClickTime < 55) return; // throttle ~18/sec max
  lastClickTime = now;
  const ac = getAudioCtx();
  const buf = ac.createBuffer(1, ac.sampleRate * 0.03, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) {
    const t = i / ac.sampleRate;
    d[i] = (Math.random() * 2 - 1) * Math.exp(-t * 80) * 0.55;
  }
  const src = ac.createBufferSource();
  src.buffer = buf;
  const filter = ac.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 1200 + Math.random() * 600;
  filter.Q.value = 2;
  const gain = ac.createGain();
  gain.gain.value = 0.4;
  src.connect(filter); filter.connect(gain); gain.connect(ac.destination);
  src.start();
}

function playMiss() {
  if (muted) return;
  const ac = getAudioCtx();
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(300, ac.currentTime);
  osc.frequency.linearRampToValueAtTime(80, ac.currentTime + 0.4);
  gain.gain.setValueAtTime(0.15, ac.currentTime);
  gain.gain.linearRampToValueAtTime(0, ac.currentTime + 0.4);
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.start();
  osc.stop(ac.currentTime + 0.4);
}

// --- State ---
let terrain, tanks, projectile, currentPlayer, gameOver, wind;
let animId = null;
let stars = [];
let windParticles = [];
let explosions = [];
let turnCount = 0;
let stats = [
  { shots: 0, hits: 0, damage: 0 },
  { shots: 0, hits: 0, damage: 0 }
];
let muted = false;
let shake = { x: 0, y: 0, intensity: 0 };

const TANK_W = 28, TANK_H = 14, BARREL_LEN = 22;
const GRAVITY = 0.07;
const BLAST_RADIUS = 30;
const DIRECT_DAMAGE = 60;
const SPLASH_DAMAGE = 30;

// --- Slider fill ---
function setSliderFill(id, isP1) {
  const el = document.getElementById(id);
  const pct = ((el.value - el.min) / (el.max - el.min)) * 100;
  const col = isP1 ? '#00e5cc' : '#ff4da6';
  el.style.background = `linear-gradient(to right, ${col} ${pct}%, #1a2a4a ${pct}%)`;
}
function refreshSliders() {
  setSliderFill('angle1', true);
  setSliderFill('power1', true);
  setSliderFill('angle2', false);
  setSliderFill('power2', false);
}

function initGame() {
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  document.getElementById('winner-overlay').classList.remove('show');
  terrain = generateTerrain();
  wind = parseFloat(((Math.random() * 2 - 1) * 1.5).toFixed(2));
  projectile = null;
  gameOver = false;
  currentPlayer = 0;
  turnCount = 0;
  windParticles = [];
  explosions = [];
  stats = [{ shots: 0, hits: 0, damage: 0 }, { shots: 0, hits: 0, damage: 0 }];

  stars = Array.from({ length: 55 }, () => ({
    x: Math.random() * W,
    y: Math.random() * H * 0.58,
    r: Math.random() < 0.15 ? 1.5 : 1,
    a: 0.4 + Math.random() * 0.6
  }));

  const x1 = 80, x2 = W - 80;
  tanks = [
    { x: x1, y: terrainY(x1) - TANK_H, hp: 100, color: '#00e5cc', id: 0, vy: 0, falling: false },
    { x: x2, y: terrainY(x2) - TANK_H, hp: 100, color: '#ff4da6', id: 1, vy: 0, falling: false }
  ];

  document.getElementById('fire-btn').disabled = false;
  refreshSliders();
  updateUI();
  // Always-running loop for particles + physics
  gameLoop();
}

// --- Terrain ---
function generateTerrain() {
  // Control-point terrain with cosine interpolation for distinct mountain peaks
  const numCtrl = 8 + Math.floor(Math.random() * 4);
  const ctrls = [[0, H * 0.7 + (Math.random() - 0.5) * 20]];
  for (let i = 1; i < numCtrl - 1; i++) {
    const x = (W * i) / (numCtrl - 1) + (Math.random() - 0.5) * 50;
    const isPeak = i % 2 === 1;
    const y = isPeak
      ? H * 0.30 + Math.random() * H * 0.22
      : H * 0.58 + Math.random() * H * 0.14;
    ctrls.push([Math.max(20, Math.min(W - 20, x)), y]);
  }
  ctrls.push([W, H * 0.7 + (Math.random() - 0.5) * 20]);
  ctrls.sort((a, b) => a[0] - b[0]);

  const pts = new Float32Array(W);
  for (let x = 0; x < W; x++) {
    let c0 = ctrls[0], c1 = ctrls[ctrls.length - 1];
    for (let i = 0; i < ctrls.length - 1; i++) {
      if (ctrls[i][0] <= x && ctrls[i + 1][0] >= x) {
        c0 = ctrls[i]; c1 = ctrls[i + 1]; break;
      }
    }
    const span = c1[0] - c0[0];
    const t = span < 1 ? 0 : (x - c0[0]) / span;
    const tc = (1 - Math.cos(t * Math.PI)) / 2; // cosine ease
    pts[x] = c0[1] * (1 - tc) + c1[1] * tc;
  }
  return pts;
}

function terrainY(x) {
  return terrain[Math.round(Math.max(0, Math.min(W - 1, x)))];
}

function destroyTerrain(cx, cy, radius) {
  for (let x = Math.max(0, Math.floor(cx - radius)); x <= Math.min(W - 1, Math.ceil(cx + radius)); x++) {
    const dx = x - cx;
    const depth = Math.sqrt(Math.max(0, radius * radius - dx * dx));
    const newY = cy + depth;
    if (newY > terrain[x]) terrain[x] = newY;
  }
}

// --- Wind particles ---
function tickWindParticles() {
  const abs = Math.abs(wind);
  if (abs > 0.05 && Math.random() < 0.45 + abs * 0.35) {
    const fromLeft = wind > 0;
    // Mix edge spawns (60%) with mid-screen spawns (40%) so sky always looks active
    const edgeSpawn = Math.random() < 0.6;
    const x = edgeSpawn
      ? (fromLeft ? -Math.random() * 20 : W + Math.random() * 20)
      : (fromLeft ? Math.random() * W * 0.35 : W - Math.random() * W * 0.35);
    windParticles.push({
      x,
      y: 5 + Math.random() * (H * 0.54),
      len: 10 + abs * 10 + Math.random() * 10, // length clearly scales with speed
      alpha: 0.12 + Math.random() * 0.16,
      vy: (Math.random() - 0.5) * 0.2,
      spd: Math.abs(wind) * 1.6 + 0.4 + Math.random() * 0.4
    });
  }
  windParticles = windParticles.filter(p => {
    p.x += (wind > 0 ? 1 : -1) * p.spd;
    p.y += p.vy;
    p.alpha -= 0.0015;
    return p.alpha > 0.005 && p.x > -35 && p.x < W + 35;
  });
  if (windParticles.length > 130) windParticles.splice(0, windParticles.length - 130);
}

function drawWindParticles() {
  ctx.save();
  ctx.lineWidth = 1;
  windParticles.forEach(p => {
    ctx.globalAlpha = p.alpha;
    ctx.strokeStyle = '#aaccff';
    // Tail points opposite to travel direction
    const tailX = p.x - (wind > 0 ? p.len : -p.len);
    ctx.beginPath();
    ctx.moveTo(Math.round(p.x), Math.round(p.y));
    ctx.lineTo(Math.round(tailX), Math.round(p.y));
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
  ctx.restore();
}

// --- Explosion animation system ---
function startExplosion(ex, ey, hitTank) {
  const n = hitTank ? 14 : 20;
  const earthColors = ['#44aa33','#66cc44','#886622','#aa7733','#3a7a28','#557733'];
  const fireColors  = ['#ff6600','#ff9900','#ffcc00','#ff3300','#ff8800'];
  const particles = Array.from({length: n}, () => {
    const a = Math.random() * Math.PI * 2;
    const spd = 1.2 + Math.random() * (hitTank ? 4 : 3.2);
    const colors = hitTank ? fireColors : earthColors;
    return {
      x: ex, y: ey,
      vx: Math.cos(a) * spd,
      vy: Math.sin(a) * spd - (hitTank ? 2.5 : 2),
      sz: hitTank ? 3 + Math.random() * 3 : 2 + Math.random() * 4,
      col: colors[Math.floor(Math.random() * colors.length)]
    };
  });
  explosions.push({
    x: ex, y: ey, frame: 0,
    maxFrames: hitTank ? 28 : 38,
    maxR: BLAST_RADIUS * (hitTank ? 1.5 : 1.0),
    hitTank, particles
  });
}

function tickExplosions() {
  explosions.forEach(e => {
    e.frame++;
    e.particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.13;
      p.vx *= 0.97;
    });
  });
  explosions = explosions.filter(e => e.frame < e.maxFrames);
}

function drawExplosions() {
  explosions.forEach(e => {
    const prog = e.frame / e.maxFrames;
    const expandT = Math.min(prog / 0.45, 1);
    const fadeT  = Math.max(0, (prog - 0.25) / 0.75);
    const r = e.maxR * expandT;
    const alpha = 1 - fadeT;

    if (r > 0.5 && alpha > 0) {
      ctx.save();
      const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, r);
      if (e.hitTank) {
        g.addColorStop(0,   `rgba(255,255,200,${alpha})`);
        g.addColorStop(0.3, `rgba(255,160,0,${alpha*0.9})`);
        g.addColorStop(0.7, `rgba(255,50,0,${alpha*0.55})`);
        g.addColorStop(1,   'rgba(200,0,0,0)');
      } else {
        g.addColorStop(0,   `rgba(255,240,150,${alpha*0.88})`);
        g.addColorStop(0.35,`rgba(210,110,0,${alpha*0.72})`);
        g.addColorStop(0.7, `rgba(160,70,0,${alpha*0.38})`);
        g.addColorStop(1,   'rgba(80,30,0,0)');
      }
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
      ctx.fill();
      // Smoke puff for ground hits
      if (!e.hitTank && prog > 0.35) {
        const sr = r * 0.45;
        const sa = Math.min((prog - 0.35) * 1.2, 1) * alpha * 0.35;
        ctx.beginPath();
        ctx.arc(e.x, e.y - sr * 0.5, sr, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(90,85,70,${sa})`;
        ctx.fill();
      }
      ctx.restore();
    }

    // Debris
    ctx.save();
    e.particles.forEach(p => {
      const pa = Math.max(0, 1 - prog * 1.1);
      if (pa <= 0) return;
      ctx.globalAlpha = pa;
      ctx.fillStyle = p.col;
      const s = Math.max(1, Math.round(p.sz * (1 - prog * 0.6)));
      ctx.fillRect(Math.round(p.x) - (s>>1), Math.round(p.y) - (s>>1), s, s);
    });
    ctx.globalAlpha = 1;
    ctx.restore();
  });
}

// --- Tank fall physics ---
function stepTankPhysics() {
  tanks.forEach(t => {
    if (!t.falling) return;
    t.vy += 0.22;
    t.y += t.vy;
    const floor = terrainY(t.x) - TANK_H;
    if (t.y >= floor) {
      t.y = floor;
      // Small bounce
      if (Math.abs(t.vy) > 1.5) t.vy = -t.vy * 0.18;
      else { t.vy = 0; t.falling = false; }
    }
  });
}

// --- Render ---
function render() {
  ctx.clearRect(0, 0, W, H);

  // Sky
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.75);
  sky.addColorStop(0, '#07091c');
  sky.addColorStop(1, '#0d1a3a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Stars
  stars.forEach(s => {
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#fff';
    ctx.fillRect(Math.round(s.x), Math.round(s.y), s.r > 1 ? 2 : 1, s.r > 1 ? 2 : 1);
  });
  ctx.globalAlpha = 1;

  ctx.save();
  ctx.translate(Math.round(shake.x), Math.round(shake.y));

  drawWindParticles();
  drawTerrain();
  drawTrajectoryPreview();
  tanks.forEach(t => drawTank(t));
  drawExplosions();
  if (projectile) drawProjectile();

  ctx.restore();
}

function drawTerrain() {
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x < W; x++) ctx.lineTo(x, terrain[x]);
  ctx.lineTo(W, H);
  ctx.closePath();

  const grad = ctx.createLinearGradient(0, H * 0.3, 0, H);
  grad.addColorStop(0, '#3dcc52');
  grad.addColorStop(0.25, '#30aa44');
  grad.addColorStop(0.7, '#1e7530');
  grad.addColorStop(1, '#0e3a18');
  ctx.fillStyle = grad;
  ctx.fill();

  // Bright top edge
  ctx.beginPath();
  ctx.moveTo(0, terrain[0]);
  for (let x = 1; x < W; x++) ctx.lineTo(x, terrain[x]);
  ctx.strokeStyle = '#55ee6a';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawTank(t) {
  if (t.hp <= 0) return;
  const tx = Math.round(t.x);
  const ty = Math.round(t.y);
  const col = t.color;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(tx - 22, ty + 12, 44, 4);

  // Treads
  ctx.fillStyle = '#1e1e2e';
  ctx.fillRect(tx - 22, ty + 5, 44, 10);
  // Tread segments
  ctx.fillStyle = '#2e2e40';
  for (let i = -20; i <= 16; i += 7) ctx.fillRect(tx + i, ty + 6, 5, 8);
  // Wheel highlights
  ctx.fillStyle = '#484860';
  for (let i = -17; i <= 14; i += 9) ctx.fillRect(tx + i, ty + 7, 5, 6);

  // Body
  ctx.fillStyle = col;
  ctx.fillRect(tx - 18, ty - 1, 36, 8);
  // Body shadow edge
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fillRect(tx - 18, ty + 5, 36, 2);

  // Turret
  ctx.fillStyle = col;
  ctx.fillRect(tx - 9, ty - 10, 18, 11);
  // Turret shadow
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(tx - 9, ty - 1, 18, 2);

  // Barrel
  const angle = getAngle(t);
  ctx.save();
  ctx.translate(tx, ty - 5);
  ctx.rotate(-angle);
  ctx.fillStyle = col;
  ctx.fillRect(0, -3, BARREL_LEN + 2, 5);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(BARREL_LEN - 4, -3, 6, 5);
  ctx.restore();

  // Angle indicator (white lines forming angle wedge)
  drawAngleIndicator(t, tx, ty - 5, angle);

  // Damage effects (smoke / fire)
  drawTankDamage(t, tx, ty);

  // HP label
  ctx.fillStyle = '#fff';
  ctx.font = '7px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.fillText(t.hp, tx, ty - 16);
}

function drawAngleIndicator(t, px, py, angle) {
  const deg = parseInt(t.id === 0
    ? document.getElementById('angle1').value
    : document.getElementById('angle2').value);
  const lineLen = 26;

  ctx.save();
  ctx.globalAlpha = 0.65;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;

  // Horizontal reference line (pointing toward the enemy)
  const refDir = t.id === 0 ? 1 : -1;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px + refDir * lineLen, py);
  ctx.stroke();

  // Barrel direction line
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px + Math.cos(angle) * lineLen, py - Math.sin(angle) * lineLen);
  ctx.stroke();

  ctx.globalAlpha = 1;
  ctx.restore();

  // Degree label
  ctx.fillStyle = '#fff';
  ctx.font = '7px "Press Start 2P"';
  ctx.textAlign = t.id === 0 ? 'left' : 'right';
  const lx = t.id === 0 ? px + lineLen + 4 : px - lineLen - 4;
  ctx.fillText(deg + '\u00b0', lx, py - 6);
}

function getAngle(tank) {
  const deg = parseInt(tank.id === 0
    ? document.getElementById('angle1').value
    : document.getElementById('angle2').value);
  return (deg * Math.PI) / 180;
}

function drawProjectile() {
  const p = projectile;
  for (let i = Math.max(0, p.trail.length - 14); i < p.trail.length; i++) {
    const pt = p.trail[i];
    const alpha = ((i - (p.trail.length - 14)) / 14) * 0.55;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ffe066';
    ctx.fillRect(Math.round(pt.x) - 1, Math.round(pt.y) - 1, 3, 3);
  }
  ctx.globalAlpha = 1;
  // Pixel bullet
  ctx.fillStyle = '#ff3333';
  ctx.fillRect(Math.round(p.x) - 3, Math.round(p.y) - 3, 6, 6);
  ctx.fillStyle = '#ffcc00';
  ctx.fillRect(Math.round(p.x) - 1, Math.round(p.y) - 1, 3, 3);
}

// --- Screen shake ---
function triggerShake(intensity) {
  shake.intensity = Math.max(shake.intensity, intensity);
}
function tickShake() {
  if (shake.intensity < 0.3) { shake.x = 0; shake.y = 0; shake.intensity = 0; return; }
  shake.x = (Math.random() * 2 - 1) * shake.intensity;
  shake.y = (Math.random() * 2 - 1) * shake.intensity;
  shake.intensity *= 0.82;
}

// --- Trajectory preview ---
function drawTrajectoryPreview() {
  if (projectile || gameOver) return;
  const t = tanks[currentPlayer];
  if (!t || t.hp <= 0) return;
  const angleEl = currentPlayer === 0 ? document.getElementById('angle1') : document.getElementById('angle2');
  const powerEl = currentPlayer === 0 ? document.getElementById('power1') : document.getElementById('power2');
  const angle = parseFloat(angleEl.value) * Math.PI / 180;
  const power = parseFloat(powerEl.value) * 0.09;
  let px = t.x + Math.cos(angle) * BARREL_LEN;
  let py = (t.y - 5) - Math.sin(angle) * BARREL_LEN;
  let vx = Math.cos(angle) * power;
  let vy = -Math.sin(angle) * power;
  const col = t.color;
  ctx.save();
  ctx.setLineDash([4, 6]);
  ctx.strokeStyle = col;
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(px, py);
  for (let i = 0; i < 220; i++) {
    vy += GRAVITY;
    vx += wind * 0.01;
    px += vx;
    py += vy;
    if (px < -10 || px > W + 10 || py > H + 10) break;
    if (py >= terrainY(px)) break;
    ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
  ctx.restore();
}

// --- Tank damage states ---
function drawTankDamage(t, tx, ty) {
  if (t.hp <= 0) return;
  const now = Date.now();
  if (t.hp < 50) {
    // Smoke puffs
    for (let i = 0; i < 3; i++) {
      const offset = (now * 0.001 + i * 2.1) % 3;
      const alpha = Math.max(0, 0.45 - offset * 0.15);
      const r = 4 + offset * 3;
      const ox = Math.sin(now * 0.002 + i * 1.7) * 5;
      ctx.beginPath();
      ctx.arc(tx + ox, ty - 10 - offset * 7, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(120,110,100,${alpha})`;
      ctx.fill();
    }
  }
  if (t.hp < 25) {
    // Fire flickers
    for (let i = 0; i < 4; i++) {
      const flick = (now * 0.004 + i * 1.3) % 1;
      const alpha = Math.max(0, 0.75 - flick * 0.5);
      const r = 3 + flick * 3;
      const ox = Math.sin(now * 0.005 + i * 0.9) * 6;
      const fireColor = flick < 0.5
        ? `rgba(255,160,0,${alpha})`
        : `rgba(255,60,0,${alpha})`;
      ctx.beginPath();
      ctx.arc(tx + ox, ty - 5 - flick * 8, r, 0, Math.PI * 2);
      ctx.fillStyle = fireColor;
      ctx.fill();
    }
  }
}

// --- Mute toggle ---
function toggleMute() {
  muted = !muted;
  const btn = document.getElementById('mute-btn');
  btn.textContent = muted ? 'SFX: OFF' : 'SFX: ON';
  btn.classList.toggle('muted', muted);
}

// --- Game loop ---
function gameLoop() {
  animId = requestAnimationFrame(gameLoop);
  if (projectile) stepPhysics();
  stepTankPhysics();
  tickWindParticles();
  tickExplosions();
  tickShake();
  render();
}

// --- Physics ---
function fire() {
  if (projectile || gameOver) return;
  const t = tanks[currentPlayer];
  if (t.hp <= 0) return;

  const angleEl = currentPlayer === 0 ? document.getElementById('angle1') : document.getElementById('angle2');
  const powerEl = currentPlayer === 0 ? document.getElementById('power1') : document.getElementById('power2');
  const angle = parseFloat(angleEl.value) * Math.PI / 180;
  const power = parseFloat(powerEl.value) * 0.09;

  // ±10% scatter so the actual shot drifts slightly from the preview arc
  const scatter = 0.9 + Math.random() * 0.2;
  projectile = {
    x: t.x + Math.cos(angle) * BARREL_LEN,
    y: (t.y - 5) - Math.sin(angle) * BARREL_LEN,
    vx: Math.cos(angle) * power * scatter,
    vy: -Math.sin(angle) * power * scatter,
    trail: []
  };

  stats[currentPlayer].shots++;
  document.getElementById('fire-btn').disabled = true;
  setStatus('In flight...');
  playFire();
  startWhistle();
}

function stepPhysics() {
  if (!projectile) return;
  const p = projectile;

  p.trail.push({ x: p.x, y: p.y });
  if (p.trail.length > 22) p.trail.shift();

  p.vy += GRAVITY;
  p.vx += wind * 0.01;
  p.x += p.vx;
  p.y += p.vy;
  updateWhistle(p.vy);

  if (p.y >= terrainY(p.x)) { explode(p.x, p.y, false); return; }

  if (p.x < -60 || p.x > W + 60 || p.y > H + 60) {
    stopWhistle();
    playMiss();
    projectile = null;
    setStatus('Miss!');
    endTurn();
    return;
  }

  for (const t of tanks) {
    if (t.id === currentPlayer || t.hp <= 0) continue;
    const dx = p.x - t.x, dy = p.y - t.y;
    if (Math.abs(dx) < TANK_W / 2 + 4 && Math.abs(dy) < TANK_H + 4) {
      explode(p.x, p.y, true);
      return;
    }
  }
}

function explode(ex, ey, hitTank) {
  stopWhistle();
  if (hitTank) playTankExplosion(); else playExplosion();
  const shooter = currentPlayer;
  projectile = null;

  triggerShake(hitTank ? 11 : 6);
  destroyTerrain(ex, ey, BLAST_RADIUS);
  startExplosion(ex, ey, hitTank);

  // Start tank falls to new terrain level
  for (const t of tanks) {
    const floor = terrainY(t.x) - TANK_H;
    if (t.y < floor - 2) { t.vy = 0; t.falling = true; }
    else { t.y = floor; }
  }

  // Damage calculation
  let hit = false;
  for (const t of tanks) {
    if (t.hp <= 0) continue;
    const dx = ex - t.x, dy = ey - t.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    let dmg = 0;
    if (dist < 8) {
      dmg = DIRECT_DAMAGE; stats[shooter].hits++;
    } else if (dist < BLAST_RADIUS + 20) {
      dmg = Math.round(SPLASH_DAMAGE * (1 - dist / (BLAST_RADIUS + 20)));
      if (dmg > 0) stats[shooter].hits++;
    }
    if (dmg > 0) { t.hp = Math.max(0, t.hp - dmg); stats[shooter].damage += dmg; hit = true; }
  }

  // Delay post-explosion logic so falls + animation play first
  const delay = hitTank ? 700 : 900;
  setTimeout(() => {
    // Snap any still-falling tanks (edge case)
    for (const t of tanks) { if (t.falling) { t.y = terrainY(t.x) - TANK_H; t.falling = false; } }
    updateUI();
    const dead = tanks.filter(t => t.hp <= 0);
    if (dead.length > 0) {
      gameOver = true;
      setTimeout(() => showWinner(tanks.find(t => t.hp > 0)), 200);
      return;
    }
    setStatus(hit ? 'Hit!' : 'Miss!');
    setTimeout(() => endTurn(), 300);
  }, delay);
}

function endTurn() {
  currentPlayer = currentPlayer === 0 ? 1 : 0;
  turnCount++;
  // Wind shifts every ~4 turns, with a small drift each turn
  if (turnCount % 4 === 0) {
    wind = parseFloat(((Math.random() * 2 - 1) * 1.5).toFixed(2));
  } else {
    wind = parseFloat(Math.max(-1.5, Math.min(1.5, wind + (Math.random() - 0.5) * 0.2)).toFixed(2));
  }
  document.getElementById('fire-btn').disabled = false;
  updateUI();
}

function showWinner(winner) {
  cancelAnimationFrame(animId); animId = null;
  const name = winner ? `PLAYER ${winner.id + 1} WINS!` : 'DRAW!';
  document.getElementById('w-name').textContent = name;

  for (let i = 0; i < 2; i++) {
    const s = stats[i];
    const acc = s.shots > 0 ? Math.round((s.hits / s.shots) * 100) + '%' : '0%';
    document.getElementById(`s-acc${i + 1}`).textContent = acc;
    document.getElementById(`s-dmg${i + 1}`).textContent = s.damage + ' HP';
    document.getElementById(`s-hit${i + 1}`).textContent = s.hits;
  }

  document.getElementById('winner-overlay').classList.add('show');
}

function setStatus(msg) {
  document.getElementById('status-msg').textContent = msg;
}

function updateWindDisplay() {
  const abs = Math.abs(wind);
  const count = Math.max(1, Math.min(5, Math.round(abs * 3.2)));
  const arrow = wind >= 0 ? '►' : '◄';
  const arrows = abs < 0.08 ? '─' : arrow.repeat(count);
  const intensity = Math.min(1, abs / 1.5);
  const r = Math.round(100 + intensity * 155);
  const g = Math.round(160 - intensity * 60);
  const b = Math.round(220 - intensity * 130);
  const dirEl = document.getElementById('wind-dir');
  dirEl.textContent = arrows;
  dirEl.style.color = `rgb(${r},${g},${b})`;
  document.getElementById('wind-val').textContent = 'WIND: ' + (wind > 0 ? '+' : '') + wind.toFixed(2);
}

function updateUI() {
  const hp1 = tanks[0].hp, hp2 = tanks[1].hp;
  document.getElementById('hp1').style.width = hp1 + '%';
  document.getElementById('hp2').style.width = hp2 + '%';
  document.getElementById('hp1val').textContent = hp1 + ' HP';
  document.getElementById('hp2val').textContent = hp2 + ' HP';
  document.getElementById('panel1').classList.toggle('active', currentPlayer === 0);
  document.getElementById('panel2').classList.toggle('active', currentPlayer === 1);
  updateWindDisplay();
  if (!gameOver) setStatus(currentPlayer === 0 ? "P1's turn" : "P2's turn");
}

// Slider events
['angle1', 'power1', 'angle2', 'power2'].forEach(id => {
  const el = document.getElementById(id);
  const valEl = document.getElementById(id + 'val');
  const isP1 = id.endsWith('1');
  el.addEventListener('input', () => {
    valEl.textContent = id.startsWith('angle') ? el.value + '\u00b0' : el.value;
    setSliderFill(id, isP1);
    playSliderClick();
  });
});

// --- Keyboard shortcuts ---
document.addEventListener('keydown', e => {
  // Skip if an input is focused
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  if (gameOver) return;
  const angleId = currentPlayer === 0 ? 'angle1' : 'angle2';
  const powerId = currentPlayer === 0 ? 'power1' : 'power2';
  const angleEl = document.getElementById(angleId);
  const powerEl = document.getElementById(powerId);
  const angleValEl = document.getElementById(angleId + 'val');
  const powerValEl = document.getElementById(powerId + 'val');
  const isP1 = currentPlayer === 0;
  let changed = false;
  switch (e.key) {
    case 'w': case 'W': case 'ArrowUp':
      angleEl.value = Math.min(180, parseInt(angleEl.value) + 2);
      angleValEl.textContent = angleEl.value + '\u00b0';
      setSliderFill(angleId, isP1); playSliderClick(); changed = true; break;
    case 's': case 'S': case 'ArrowDown':
      angleEl.value = Math.max(0, parseInt(angleEl.value) - 2);
      angleValEl.textContent = angleEl.value + '\u00b0';
      setSliderFill(angleId, isP1); playSliderClick(); changed = true; break;
    case 'd': case 'D': case 'ArrowRight':
      powerEl.value = Math.min(100, parseInt(powerEl.value) + 2);
      powerValEl.textContent = powerEl.value;
      setSliderFill(powerId, isP1); playSliderClick(); changed = true; break;
    case 'a': case 'A': case 'ArrowLeft':
      powerEl.value = Math.max(5, parseInt(powerEl.value) - 2);
      powerValEl.textContent = powerEl.value;
      setSliderFill(powerId, isP1); playSliderClick(); changed = true; break;
    case ' ':
      e.preventDefault();
      if (!projectile) fire(); break;
  }
});

initGame();
</script>
